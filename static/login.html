<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dotPesa Admin Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #e6e6e6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .login-container .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-container .logo-icon {
            height: 44px;
            width: auto;
            display: block;
            margin: 0 auto;
        }
        .login-container .logo .sub {
            color: #666;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
        .login-container .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 32px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0d0d0d;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00e701;
        }
        .form-group input::placeholder {
            color: #555;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #00e701;
            color: #0d0d0d;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Archivo', -apple-system, sans-serif;
        }
        .btn:hover {
            background: #00ff1a;
            transform: scale(1.01);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .error {
            color: #ef4444;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        .success {
            color: #00e701;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #666;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #aaa;
        }
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #0d0d0d;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            max-width: 400px;
        }
        .toast.error {
            background: #ef4444;
            color: #fff;
        }
        .toast.success {
            background: #00e701;
            color: #0d0d0d;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .role-badge {
            font-size: 11px;
            background: #2a2a2a;
            padding: 2px 10px;
            border-radius: 12px;
            color: #888;
            margin-top: 8px;
            display: inline-block;
        }
        .role-badge.admin {
            background: #00e70120;
            color: #00e701;
        }
        .role-badge.influencer {
            background: #f59e0b20;
            color: #f59e0b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="icon.svg" alt="dotPesa" class="logo-icon" />
            <div class="sub">Admin Portal</div>
        </div>
        <div class="subtitle">Sign in to manage the platform</div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="admin@example.com" 
                    required 
                    autocomplete="email"
                />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="current-password"
                />
            </div>
            <button type="submit" class="btn" id="loginBtn">Sign In</button>
            <div id="message"></div>
        </form>
        
        <a href="/" class="back-link">← Back to dotPesa</a>
    </div>

    <div class="toast-container" id="toasts"></div>

    <script>
        const API_URL = window.location.origin;

        function toast(message, type = 'error') {
            const container = document.getElementById('toasts');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('message');
            
            if (!email || !password) {
                msg.innerHTML = '<div class="error">Please enter email and password</div>';
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> Signing in...';
            msg.innerHTML = '';
            
            try {
                const response = await fetch(`${API_URL}/api/auth/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }
                
                if (data.success) {
                    sessionStorage.setItem('dotpesa_admin_token', data.data.token);
                    sessionStorage.setItem('dotpesa_admin_user', JSON.stringify(data.data.user));

                    const role = data.data.user.role;
                    const destination = role === 'influencer' ? '/admin/influencer.html' : '/admin/dashboard.html';

                    toast(role === 'influencer' ? 'Welcome influencer!' : 'Welcome admin!', 'success');
                    msg.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
                    
                    setTimeout(() => {
                        window.location.href = `${destination}?token=${data.data.token}`;
                    }, 500);
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            } catch (err) {
                msg.innerHTML = `<div class="error">${err.message}</div>`;
                toast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        }

        // Check if already logged in
        const token = sessionStorage.getItem('dotpesa_admin_token');
        const storedUser = JSON.parse(sessionStorage.getItem('dotpesa_admin_user') || 'null');
        if (token && storedUser) {
            const isInfluencer = storedUser.role === 'influencer';
            const checkUrl = isInfluencer ? '/api/influencer/balance' : '/api/admin/stats';
            const destination = isInfluencer ? '/admin/influencer.html' : '/admin/dashboard.html';

            fetch(`${API_URL}${checkUrl}`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if (res.ok) {
                    window.location.href = destination;
                } else {
                    sessionStorage.removeItem('dotpesa_admin_token');
                    sessionStorage.removeItem('dotpesa_admin_user');
                }
            })
            .catch(() => {
                sessionStorage.removeItem('dotpesa_admin_token');
                sessionStorage.removeItem('dotpesa_admin_user');
            });
        }
    </script>
</body>
</html>
